[project]
name = "ai-document-intelligence"
version = "0.1.0"
description = "Evidence-first document intelligence application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb>=1.5,<2.0",
  "fastapi>=0.116,<1.0",
  "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
  "pdfplumber>=0.11,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "pytesseract>=0.3.13,<1.0",
  "sentence-transformers>=5.1,<6.0",
  "spacy>=3.8,<4.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "gdown>=5.2,<6.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]
ocr-eval = [
  "easyocr==1.7.2",
  "torchvision==0.27.0",
]
ner-eval = [
  "transformers>=5.0,<6.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
