<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#405b78"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #17262d; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #56666d; }
      .actor { fill: #fffdf8; stroke: #176b62; stroke-width: 2; rx: 5; }
      .actorText { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #17262d; }
      .step { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #17262d; }
      .note { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #56666d; }
      .life { stroke: #aeb9b9; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .call { stroke: #405b78; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #176b62; stroke-width: 2; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
      .phase { fill: #e8f2ee; stroke: none; rx: 4; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7f4ed"/>
  <text x="50" y="46" class="title">Ingestion and grounded-query sequence</text>
  <text x="50" y="74" class="subtitle">The browser receives server-owned provenance rather than model-authored source metadata.</text>

  <rect x="55" y="105" width="150" height="48" class="actor"/>
  <text x="130" y="135" text-anchor="middle" class="actorText">React UI</text>
  <rect x="290" y="105" width="150" height="48" class="actor"/>
  <text x="365" y="135" text-anchor="middle" class="actorText">FastAPI</text>
  <rect x="525" y="105" width="150" height="48" class="actor"/>
  <text x="600" y="135" text-anchor="middle" class="actorText">SQLite / FTS5</text>
  <rect x="760" y="105" width="150" height="48" class="actor"/>
  <text x="835" y="135" text-anchor="middle" class="actorText">Chroma</text>
  <rect x="995" y="105" width="150" height="48" class="actor"/>
  <text x="1070" y="135" text-anchor="middle" class="actorText">Qwen</text>

  <line x1="130" y1="153" x2="130" y2="680" class="life"/>
  <line x1="365" y1="153" x2="365" y2="680" class="life"/>
  <line x1="600" y1="153" x2="600" y2="680" class="life"/>
  <line x1="835" y1="153" x2="835" y2="680" class="life"/>
  <line x1="1070" y1="153" x2="1070" y2="680" class="life"/>

  <rect x="35" y="174" width="1130" height="200" class="phase" opacity="0.45"/>
  <text x="50" y="199" class="actorText">INGESTION</text>
  <path d="M130 224 H365" class="call"/>
  <text x="247" y="216" text-anchor="middle" class="step">POST PDF</text>
  <path d="M365 260 H600" class="call"/>
  <text x="482" y="252" text-anchor="middle" class="step">Store hash, pages, chunks, entities</text>
  <path d="M365 300 H835" class="call"/>
  <text x="600" y="292" text-anchor="middle" class="step">Encode and persist chunk vectors</text>
  <path d="M835 336 H365" class="return"/>
  <text x="600" y="328" text-anchor="middle" class="step">Index complete</text>
  <path d="M365 358 H130" class="return"/>
  <text x="247" y="350" text-anchor="middle" class="step">Ready status or controlled error</text>

  <rect x="35" y="396" width="1130" height="270" class="phase" opacity="0.3"/>
  <text x="50" y="422" class="actorText">QUERY</text>
  <path d="M130 448 H365" class="call"/>
  <text x="247" y="440" text-anchor="middle" class="step">POST question</text>
  <path d="M365 484 H600" class="call"/>
  <text x="482" y="476" text-anchor="middle" class="step">Lexical candidates</text>
  <path d="M365 520 H835" class="call"/>
  <text x="600" y="512" text-anchor="middle" class="step">Semantic candidates</text>
  <path d="M835 548 H365" class="return"/>
  <text x="600" y="540" text-anchor="middle" class="step">Ranked IDs; weighted RRF</text>
  <path d="M365 580 H1070" class="call"/>
  <text x="717" y="572" text-anchor="middle" class="step">Question + five contexts labelled C1-C5</text>
  <path d="M1070 612 H365" class="return"/>
  <text x="717" y="604" text-anchor="middle" class="step">Structured claims and citation IDs</text>
  <path d="M365 646 H130" class="return"/>
  <text x="247" y="638" text-anchor="middle" class="step">Validated claims + server-owned contexts</text>
  <text x="600" y="696" text-anchor="middle" class="note">Unknown citations fail the generation contract; context IDs always resolve to stored document and page data.</text>
</svg>
